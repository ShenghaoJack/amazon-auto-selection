[pytest]
# 2026-11-12: 测试代码统一放 tests/（散落的 ad-hoc 脚本在 tests/scattered，已排除收集）
testpaths = tests
addopts = -p no:cacheprovider
# norecursedirs = 目录**名**模式; scripts/_plan_pilot 是临时脚本/自测目录(里面 test_*.py 是
# "import 即执行"的脚本, 有的还会在导入期抛错, 例如 test_num_check.py 的 ZeroDivisionError),
# 不该被根目录 `pytest` 收集 —— 2026-10-08 曾因此让全量回归在收集阶段直接中断。
norecursedirs = pytest_ws .pytest-tmp tmp* *tmp* *.egg-info .git dist build _plan_pilot scattered
