<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>类目状态 · 选品工作台</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#070a12;color:#eef2fa}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;display:flex;align-items:center;gap:16px;border-bottom:1px solid #29364e}header strong{flex:1}a{color:#a9bcff}main{max-width:1100px;margin:45px auto;padding:0 24px}h1{margin-bottom:4px}.muted{color:#a7b3c9}.panel{background:#101828;border:1px solid #29364e;border-radius:14px;padding:20px;margin-top:22px}.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #263249}.row div{flex:1}.row small{display:block;color:#a7b3c9}.row button,header button{font:inherit;color:#dce5f5;border:1px solid #40516c;background:#152139;border-radius:7px;padding:9px 12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;color:#cbd6e7;font-size:12px;line-height:1.6}@media(max-width:600px){main{margin-top:25px}.row{align-items:flex-start}.row button{white-space:nowrap}}
</style></head><body><header><strong>Pipeline Console · 只读视图</strong><span id="identity"></span><a href="/account">账号设置</a><button id="logout">退出登录</button></header><main><h1>类目状态</h1><p class="muted">查看所有类目的流程进度和近期日志。</p><div class="panel" id="list">正在加载…</div><section class="panel" id="detail" hidden><h2 id="title"></h2><div id="steps"></div><h3>近期日志</h3><pre id="log"></pre></section><p id="message" class="muted" role="status"></p></main><script>
let me;const $=s=>document.querySelector(s);async function api(path,method='GET'){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(method==='POST'?{'X-CSRF-Token':me.csrf}:{})},...(method==='POST'?{body:'{}'}:{})});const d=await r.json();if(r.status===401){location.href='/login';throw Error('登录已过期');}if(!r.ok)throw Error(d.error||'读取失败');return d;}
async function detail(file,cat){try{const d=await api('/api/status?file='+encodeURIComponent(file)+'&after=-1');$('#title').textContent=cat;$('#steps').textContent=(d.steps||[]).map(s=>'步骤 '+String(s.number).padStart(2,'0')+'：'+s.status).join('　');$('#log').textContent=(d.file_log||[]).map(l=>`${l.ts} [${l.level}] ${l.text}`).join('\n')||'暂无日志';$('#detail').hidden=false;}catch(e){$('#message').textContent=e.message}}
async function load(){try{const d=await api('/api/history');const root=$('#list');root.replaceChildren();for(const item of d.items||[]){const row=document.createElement('div');row.className='row';const content=document.createElement('div'),name=document.createElement('strong'),sub=document.createElement('small');name.textContent=item.cat;sub.textContent=`完成 ${item.done}/${item.total} · ${item.current||'等待运行'}`;content.append(name,sub);const button=document.createElement('button');button.textContent='查看详情';button.onclick=()=>detail(item.run_file,item.cat);row.append(content,button);root.append(row)}if(!root.childElementCount)root.textContent='暂无类目';}catch(e){$('#message').textContent=e.message}}
(async()=>{try{me=await api('/api/auth/me');$('#identity').textContent=me.name;await load();}catch(e){$('#message').textContent=e.message}})();$('#logout').onclick=async()=>{try{await api('/api/auth/logout','POST');location.href='/login'}catch(e){$('#message').textContent=e.message}};
</script></body></html>
