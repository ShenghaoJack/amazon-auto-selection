<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作日志 · 选品工作台</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#070a12;color:#eef2fa}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:16px;align-items:center;padding:18px 5%;border-bottom:1px solid #25324a}header a{color:#a9bcff;text-decoration:none}header strong{flex:1}main{max-width:1250px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.muted{color:#a7b3c9}.panel{margin-top:22px;padding:20px;background:#101828;border:1px solid #29364e;border-radius:14px}form{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:6px;font-size:13px;color:#c6d1e3}input,select,button{font:inherit;border-radius:7px;padding:9px 10px;border:1px solid #40516c;background:#0b1322;color:#fff}button{cursor:pointer;background:#86a7ff;color:#081222;border-color:#86a7ff;font-weight:700}button.secondary{background:transparent;color:#dce5f5;border-color:#40516c}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #29364e;padding:9px 8px;font-size:13.5px;vertical-align:top}th{color:#a7b3c9;font-size:12.5px;white-space:nowrap}.table-wrap{overflow:auto;max-height:68vh}.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:#17233a;border:1px solid #2c3c58;font-size:12px;color:#bcd0ff}.msg{min-height:1.4em;color:#ffd19a;margin-top:10px}code{font-family:var(--mono,Consolas,monospace);color:#9fb3d9;font-size:12px}@media(max-width:700px){form label{width:100%}}
</style></head><body><header><a href="/">← 返回工作台</a><strong>操作日志</strong><span id="identity" class="muted"></span><a href="/accounts" class="muted">账号设置</a><button class="secondary" id="logout">退出登录</button></header><main><h1>操作日志</h1><p class="muted" id="scopeHint">正在加载…</p><section class="panel"><form id="filters"><label>账号<input name="actor" placeholder="全部账号"></label><label>类目<input name="cat" placeholder="全部类目"></label><label>最近天数<input name="days" type="number" min="1" max="365" value="7" style="width:92px"></label><label>关键词<input name="q" placeholder="动作 / 接口 / 细节"></label><label>条数<select name="limit"><option>100</option><option selected>200</option><option>500</option><option>1000</option></select></label><button>查询</button></form><p class="msg" id="message" role="status"></p></section><section class="panel"><h2>记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>账号</th><th>动作</th><th>类目</th><th>细节</th><th>接口</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let me;const $=s=>document.querySelector(s),message=s=>{$('#message').textContent=s||''};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(method==='POST'?{'X-CSRF-Token':me.csrf}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(r.status===401){location.href='/login';throw Error('登录已过期');}if(!r.ok)throw Error(d.error||'操作失败');return d;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(at){const d=new Date((Number(at)||0)*1000);if(Number.isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
async function load(){const f=$('#filters').elements;const qs=new URLSearchParams();for(const k of ['actor','cat','days','q','limit']){const v=(f.namedItem(k)?.value||'').trim();if(v)qs.set(k,v);}try{message('正在查询…');const d=await api('/api/oplog?'+qs.toString());$('#scopeHint').textContent=d.scope==='all'?'管理员视图：显示所有账号的操作记录。':'仅显示你自己的操作记录。';const tb=$('#rows');tb.replaceChildren();for(const it of (d.items||[])){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(fmt(it.at))}</td><td>${esc(it.actor)}</td><td><span class="tag">${esc(it.action)}</span></td><td>${esc(it.cat||'—')}</td><td>${esc(it.detail||'')}</td><td><code>${esc(it.target||'')}</code></td>`;tb.append(tr);}if(!(d.items||[]).length){const tr=document.createElement('tr');tr.innerHTML='<td colspan="6" class="muted">没有匹配的记录</td>';tb.append(tr);}message(`共 ${(d.items||[]).length} 条`);}catch(e){message(e.message);}}
(async()=>{try{me=await api('/api/auth/me');$('#identity').textContent=me.name+' · '+me.role;if(me.role!=='admin'){const a=$('#filters').elements.namedItem('actor');if(a){a.value=me.name;a.disabled=true;}}await load();}catch(e){message(e.message)}})();
$('#filters').onsubmit=e=>{e.preventDefault();load()};
$('#logout').onclick=async()=>{try{await api('/api/auth/logout','POST',{});location.href='/login';}catch(e){message(e.message)}};
</script></body></html>
