<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>操作日志 · Pipeline Console</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#070a12;
    --bg2:#0a0f1c;
    --glass:rgba(255,255,255,.035);
    --glass-2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.14);
    --txt:#eef2fa;
    --txt-2:#a7b3c9;
    --dim:#6b7a96;
    --acc:#7aa2ff;
    --acc-2:#5eead4;
    --grad:linear-gradient(135deg,#6ea8ff 0%,#8b7bff 55%,#5eead4 130%);
    --ok:#34d399;
    --warn:#fbbf24;
    --bad:#fb7185;
    --mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
    --sans:"Inter","SF Pro Text",-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --r:16px;
    --shadow:0 12px 30px -18px rgba(0,0,0,.72);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font:13.5px/1.6 var(--sans);min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .gridline{
    position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:56px 56px;
  }
  [hidden]{display:none !important}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

  /* ---------- 统一顶栏 ---------- */
  header.topbar{
    position:sticky;top:0;z-index:80;padding:12px 26px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:rgba(7,10,18,.92);border-bottom:1px solid var(--line);
  }
  .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--txt)}
  .logo{
    width:32px;height:32px;border-radius:10px;position:relative;flex:none;
    background:var(--grad);display:grid;place-items:center;
    box-shadow:0 6px 20px -6px rgba(122,162,255,.72);
  }
  .logo::after{content:"";position:absolute;inset:0;border-radius:10px;border:1px solid rgba(255,255,255,.32)}
  .logo svg{width:17px;height:17px;color:#fff}
  .brand .t1{font-size:14.5px;font-weight:700;letter-spacing:.2px;line-height:1.15}
  .brand .t2{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .spacer{flex:1}

  .hdr-actions{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hdr-sep{width:1px;height:16px;background:var(--line-2);margin:0 2px;opacity:.75}
  .hdr-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:32px;padding:0 12px;border-radius:10px;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.01em;line-height:1;
    color:var(--txt-2);text-decoration:none;white-space:nowrap;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    transition:transform .18s var(--ease),background .22s,border-color .22s,color .22s,box-shadow .22s;
  }
  .hdr-btn:visited{color:var(--txt-2)}
  .hdr-btn svg{width:14px;height:14px;flex:none;opacity:.82}
  .hdr-btn:hover{
    color:var(--txt);background:rgba(255,255,255,.085);border-color:var(--line-2);
    transform:translateY(-1px);
  }
  .hdr-btn.is-active{
    color:#fff;background:linear-gradient(135deg,rgba(110,168,255,.22),rgba(139,123,255,.16));
    border-color:rgba(122,162,255,.55);box-shadow:0 6px 18px -8px rgba(110,168,255,.55);
  }
  .hdr-btn.is-active:visited{color:#fff}
  .hdr-btn .dot-user{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(52,211,153,.75);flex:none}
  .hdr-btn.hdr-logout:hover{
    color:#fda4af;background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.45);
  }

  /* ---------- 主容器 & 页头 ---------- */
  main.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
  .page-hero{
    display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
    margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);
  }
  .overline{font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);opacity:.9}
  .page-hero h1{font-size:24px;font-weight:750;letter-spacing:-.01em;margin-top:4px;line-height:1.25}
  .page-hero .sub{font-size:13px;color:var(--txt-2);margin-top:4px}
  .hero-pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stat-pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--txt-2);
  }
  .stat-pill b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- 玻璃卡片 ---------- */
  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);margin-top:18px;position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);opacity:.55;
  }
  .card-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:18px 22px 12px;
  }
  .card-head h2{font-size:15.5px;font-weight:650;margin-top:2px}
  .card-head .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .card-body{padding:4px 22px 20px}

  /* ---------- 表单与按钮 ---------- */
  form.frow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--txt-2);font-weight:500}
  input,select{
    font-family:inherit;color:var(--txt);font-size:13px;height:36px;
    background:rgba(7,10,18,.68);border:1px solid var(--line-2);border-radius:10px;
    padding:0 11px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
  }
  input:focus,select:focus{
    border-color:rgba(122,162,255,.7);box-shadow:0 0 0 3px rgba(122,162,255,.16);background:rgba(7,10,18,.9);
  }
  input:disabled{opacity:.55;cursor:not-allowed}
  select{
    appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238b9bc0' fill='none' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  button.btn{
    font-family:inherit;cursor:pointer;outline:none;height:36px;padding:0 16px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    font-size:12.5px;font-weight:650;letter-spacing:.01em;
    color:#fff;background:linear-gradient(120deg,#4f8dff,#7b6cff 60%,#39d4c4 135%);
    border:0;box-shadow:0 8px 22px -10px rgba(105,120,255,.75);
    transition:transform .16s var(--ease),filter .2s,opacity .2s;
  }
  button.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  button.btn:active{transform:translateY(0) scale(.98)}
  button.btn-ghost{
    background:rgba(255,255,255,.045);color:var(--txt);border:1px solid var(--line-2);box-shadow:none;
  }
  button.btn-ghost:hover{background:rgba(255,255,255,.095);border-color:rgba(255,255,255,.22)}

  /* ---------- 表格 & 标签 ---------- */
  .tbl-wrap{
    overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;
    background:rgba(7,10,18,.42);
  }
  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{
    position:sticky;top:0;z-index:2;text-align:left;padding:10px 12px;
    font-size:11.5px;font-weight:650;letter-spacing:.03em;color:var(--txt-2);
    background:rgba(10,15,28,.96);border-bottom:1px solid var(--line-2);white-space:nowrap;
  }
  table.tbl td{
    padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;
  }
  table.tbl tbody tr:last-child td{border-bottom:0}
  table.tbl tbody tr:hover{background:rgba(255,255,255,.028)}
  .mono{font-family:var(--mono);font-size:12px;color:#b8c7e0;white-space:nowrap}
  code.ep{font-family:var(--mono);font-size:12px;color:#93b4e8;word-break:break-all}
  .tag{
    display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
    background:rgba(122,162,255,.13);border:1px solid rgba(122,162,255,.32);color:#bfd6ff;
  }
  .tag.ok{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.32);color:#6ee7b7}
  .tag.bad{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.35);color:#fda4af}
  .tag.warn{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.35);color:#fde68a}
  .tag.dim{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--txt-2)}
  .msg-inline{font-size:12.5px;color:var(--txt-2);margin-top:10px;min-height:1.4em}

  @media(max-width:720px){
    header.topbar{padding:10px 14px}
    main.wrap{padding:18px 14px 60px}
    label.fld{width:100%}
  }
</style>
</head>
<body>
<div class="gridline" aria-hidden="true"></div>

<header class="topbar">
  <a href="/" class="brand" title="返回选品流水线工作台">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z"/></svg>
    </div>
    <div>
      <div class="t1">Pipeline Console</div>
      <div class="t2">Amazon 选品流水线</div>
    </div>
  </a>
  <a href="/" class="hdr-btn" title="返回主工作台">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>返回工作台</span>
  </a>
  <div class="spacer"></div>
  <nav class="hdr-actions" aria-label="系统导航">
    <a href="/account" class="hdr-btn" id="navAccount">
      <span class="dot-user" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-3.6 5-5 8-5s6.2 1.4 8 5"/></svg>
      <span id="identity">账号设置</span>
    </a>
    <a href="/accounts#amzLoginPanel" class="hdr-btn" id="navAmz" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18"/></svg>
      <span>亚马逊登录</span>
    </a>
    <a href="/oplog" class="hdr-btn is-active" id="navOplog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
      <span>操作日志</span>
    </a>
    <span class="hdr-sep" aria-hidden="true"></span>
    <button type="button" class="hdr-btn hdr-logout" id="logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      <span>退出登录</span>
    </button>
  </nav>
</header>

<main class="wrap">
  <div class="page-hero">
    <div>
      <div class="overline">AUDIT TRAIL</div>
      <h1>操作日志</h1>
      <p class="sub" id="scopeHint">正在加载审计记录…</p>
    </div>
    <div class="hero-pills" id="heroPills">
      <span class="stat-pill">匹配记录 <b id="countNum">—</b></span>
    </div>
  </div>

  <section class="card">
    <div class="card-head">
      <div>
        <div class="overline">FILTERS</div>
        <h2>检索条件</h2>
      </div>
    </div>
    <div class="card-body">
      <form id="filters" class="frow">
        <label class="fld">账号
          <input name="actor" placeholder="全部账号" style="width:150px">
        </label>
        <label class="fld">类目
          <input name="cat" placeholder="全部类目" style="width:190px">
        </label>
        <label class="fld">最近天数
          <input name="days" type="number" min="1" max="365" value="7" style="width:96px">
        </label>
        <label class="fld" style="flex:1;min-width:190px">关键词
          <input name="q" placeholder="动作 / 接口 / 细节">
        </label>
        <label class="fld">条数
          <select name="limit" style="width:96px">
            <option>100</option>
            <option selected>200</option>
            <option>500</option>
            <option>1000</option>
          </select>
        </label>
        <button type="submit" class="btn">查询</button>
        <button type="button" class="btn btn-ghost" id="btnReset">重置</button>
      </form>
      <div class="msg-inline" id="message" role="status"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <div class="overline">RECORDS</div>
        <h2>操作记录明细</h2>
      </div>
    </div>
    <div class="card-body">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>时间</th>
              <th>账号</th>
              <th>动作</th>
              <th>类目</th>
              <th>细节</th>
              <th>接口</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
let me;
const $ = s => document.querySelector(s);
const message = s => { $('#message').textContent = s || ''; };
async function api(path, method = 'GET', body) {
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(method === 'POST' ? { 'X-CSRF-Token': me.csrf } : {}) },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  const d = await r.json();
  if (r.status === 401) { location.href = '/login'; throw Error('登录已过期'); }
  if (!r.ok) throw Error(d.error || '操作失败');
  return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(at) {
  const d = new Date((Number(at) || 0) * 1000);
  if (Number.isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function actionClass(act) {
  const s = String(act || '').toLowerCase();
  if (s.includes('fail') || s.includes('throttl') || s.includes('delete') || s.includes('中断') || s.includes('删除')) return 'bad';
  if (s.includes('login_success') || s.includes('登录') || s.includes('create') || s.includes('保存')) return 'ok';
  if (s.includes('logout') || s.includes('退出') || s.includes('cancel')) return 'warn';
  return '';
}
const ACTION_LABELS = {
  login_success: '登录成功',
  login_failed: '登录失败',
  login_throttled: '登录限流',
  logout: '退出登录',
  create_user: '创建账号',
  update_user: '修改账号'
};

async function load() {
  const f = $('#filters').elements;
  const qs = new URLSearchParams();
  for (const k of ['actor', 'cat', 'days', 'q', 'limit']) {
    const v = (f.namedItem(k)?.value || '').trim();
    if (v) qs.set(k, v);
  }
  try {
    message('正在查询…');
    const d = await api('/api/oplog?' + qs.toString());
    $('#scopeHint').textContent = d.scope === 'all' ? '管理员视图：显示所有账号的操作记录。' : '仅显示你自己的操作记录。';
    const items = d.items || [];
    if ($('#countNum')) $('#countNum').textContent = String(items.length);
    const tb = $('#rows');
    tb.replaceChildren();
    for (const it of items) {
      const tr = document.createElement('tr');
      const label = ACTION_LABELS[it.action] || it.action || '';
      const cls = actionClass(it.action);
      tr.innerHTML = `<td class="mono">${esc(fmt(it.at))}</td><td><strong>${esc(it.actor)}</strong></td><td><span class="tag ${cls}">${esc(label)}</span></td><td>${esc(it.cat || '—')}</td><td>${esc(it.detail || '—')}</td><td><code class="ep">${esc(it.target || '—')}</code></td>`;
      tb.append(tr);
    }
    if (!items.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="6" style="color:var(--dim);text-align:center;padding:28px 12px">没有匹配的记录</td>';
      tb.append(tr);
    }
    message(`查询完成，共 ${items.length} 条记录`);
  } catch (e) { message(e.message); }
}

(async () => {
  try {
    me = await api('/api/auth/me');
    $('#identity').textContent = `${me.name} · 账号设置`;
    if (me.role === 'admin') $('#navAmz').hidden = false;
    else {
      const a = $('#filters').elements.namedItem('actor');
      if (a) { a.value = me.name; a.disabled = true; }
    }
    await load();
  } catch (e) { message(e.message); }
})();

$('#filters').onsubmit = e => { e.preventDefault(); load(); };
$('#btnReset').onclick = () => {
  const f = $('#filters').elements;
  if (me && me.role === 'admin' && f.namedItem('actor')) f.namedItem('actor').value = '';
  if (f.namedItem('cat')) f.namedItem('cat').value = '';
  if (f.namedItem('days')) f.namedItem('days').value = '7';
  if (f.namedItem('q')) f.namedItem('q').value = '';
  if (f.namedItem('limit')) f.namedItem('limit').value = '200';
  load();
};
$('#logout').onclick = async () => {
  try { await api('/api/auth/logout', 'POST', {}); location.href = '/login'; }
  catch (e) { message(e.message); }
};
</script>
</body>
</html>
