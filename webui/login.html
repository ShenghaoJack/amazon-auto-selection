<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 选品工作台</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#070a12;color:#eef2fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#17264a 0,transparent 42%),#070a12}.layout{width:min(100%,960px);display:grid;grid-template-columns:1fr 400px;gap:84px;align-items:center}.identity{padding:12px 0}.identity strong{font-size:15px;color:#a9bad6}.identity h1{font-size:clamp(34px,4.4vw,50px);line-height:1.2;letter-spacing:-.03em;margin:25px 0 16px}.identity p{color:#a7b3c9;max-width:32em;line-height:1.8;margin:0}.card{background:#101828;border:1px solid #29364e;border-radius:16px;padding:32px}.card h2{margin:0 0 6px;font-size:24px}.card>p{color:#a7b3c9;margin:0 0 27px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #3b4a63;border-radius:8px;background:#0b1322;color:#fff;font:inherit}input:focus-visible,button:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}button{width:100%;border:0;border-radius:8px;background:#8eabff;color:#091321;font:inherit;font-weight:700;padding:13px;margin-top:24px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:#ffaaa9;min-height:1.6em;margin:12px 0 0;font-size:13px}.foot{font-size:12px;color:#8494ad;margin-top:22px;line-height:1.7}@media(max-width:720px){.layout{grid-template-columns:1fr;gap:28px;max-width:440px}.identity h1{font-size:32px;margin:14px 0 8px}.card{padding:25px}}
</style></head><body><main class="layout"><section class="identity"><strong>Pipeline Console</strong><h1>选品研究，<br>从这里开始。</h1><p>登录后查看类目进度、运行工作流，并管理研究成果。</p></section><section class="card"><h2>登录工作台</h2><p>请输入管理员分配的账号和密码。</p><form id="form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="64"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit">登录</button><p id="error" class="error" role="alert"></p></form><div class="foot">忘记密码？请联系系统管理员重置。</div></section></main><script>
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登录失败');try{localStorage.setItem('wui_view','hub');}catch(e){}location.href='/';}catch(ex){error.textContent=ex.message||'无法连接服务，请重试。';}finally{button.disabled=false;}});
</script></body></html>
